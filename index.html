<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Side Questy – Toastmasters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:     #004165;
      --burgundy: #772432;
      --gold:     #F7A81B;
      --white:    #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--gold);
    }

    .tagline {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }

    .card {
      width: 100%;
      background: var(--burgundy);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
    }

    .card-label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 20px;
    }

    .quest-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1.15;
      color: var(--white);
      margin-bottom: 18px;
    }

    .quest-desc {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255,255,255,0.72);
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Side Questy</h1>
      <p class="tagline">Toastmasters &middot; Twoje zadanie na dzi&#347;</p>
    </header>

    <div class="card">
      <div class="card-label">Twoje zadanie</div>
      <div class="quest-title" id="questTitle">Ładowanie…</div>
      <div class="quest-desc"  id="questDesc"></div>
    </div>
  </div>

  <script>
    const QUESTS = [
      { title: "Lodołamacz kuluarowy", desc: "Przywitaj się z przynajmniej jedną osobą, której jeszcze nie znasz lub znasz najmniej." },
      { title: "Łącznik", desc: "Przedstaw sobie dwie osoby, które Twoim zdaniem powinny się poznać." },
      { title: "Rekrut", desc: "Zapytaj gościa o jego wrażenia i zaproś go na aftery lub kolejne spotkanie." },
      { title: "Wspólny mianownik", desc: "Znajdź osobę, która ma to samo hobby co Ty (poza przemawianiem)." },
      { title: "Wywiad", desc: "Dowiedz się od wybranej osoby, dlaczego zdecydowała się dołączyć do Toastmasters." },
      { title: "Miejscówka", desc: "Usiądź obok osoby, obok której jeszcze nigdy nie siedziałeś." },
      { title: "Detektyw mowy ciała", desc: "Daj komuś po spotkaniu pozytywny feedback dotyczący jego gestykulacji." },
      { title: "Skupienie 100%", desc: "Przesłuchaj całe wystąpienie bez ani jednego spojrzenia na telefon czy zegarek." },
      { title: "Cichy mentor", desc: "Napisz na kartce zwrotnej jedną rzecz, którą dany mówca zrobił dziś lepiej niż ostatnio." },
      { title: "Docenienie zaplecza", desc: "Podziękuj osobie pełniącej rolę techniczną za jej wkład." },
      { title: "Łowca perełek", desc: "Zanotuj trzy ciekawe zwroty ze sceny i postaraj się użyć ich w rozmowie jutro." },
      { title: "Wsparcie debiutanta", desc: "Znajdź osobę, która miała dziś swój debiut i pogratuluj jej odwagi." },
      { title: "Partyzan Słowa Dnia", desc: "Użyj „Słowa Dnia” przynajmniej 3 razy w rozmowach prywatnych podczas przerwy." },
      { title: "Mistrz pauzy", desc: "Podczas rozmowy zastosuj świadomą, 2-sekundową pauzę, zanim odpowiesz na pytanie." },
      { title: "Metaforyczny challenge", desc: "Opisz komuś swój dzień, używając przynajmniej jednej barwnej metafory." },
      { title: "Stop wypełniaczom", desc: "Nie użyj ani jednego „yyy” czy „eeee” podczas networkingowej rozmowy przy kawie." },
      { title: "Aktywne słuchanie", desc: "Podczas rozmowy potakuj i utrzymuj kontakt wzrokowy, nie przerywając ani razu." },
      { title: "Gorące Pytania", desc: "Zgłoś się jako pierwszy do sesji Gorących Pytań." },
      { title: "Power Pose", desc: "Wykonaj „pozę zwycięzcy” przez 30 sekund przed wejściem na salę." },
      { title: "Pytający", desc: "Zadaj pytanie mówcy w sesji Q&A (jeśli taka jest przewidziana)." },
      { title: "Ochotnik", desc: "Jeśli zwolni się jakaś rola w ostatniej chwili – zaproponuj swoją pomoc." },
      { title: "Uśmiech", desc: "Utrzymuj kontakt wzrokowy i uśmiechaj się do każdego, z kim mijasz się w drzwiach." },
      { title: "Ekspert od tremy", desc: "Poproś doświadczonego klubowicza o jego sposób na opanowanie tremy." },
      { title: "Planer", desc: "Zadeklaruj Wiceprezesowi ds. Edukacji, kiedy wygłosisz swoją kolejną mowę." },
      { title: "Bibliotekarz", desc: "Poleć komuś jedną książkę rozwojową, która wpłynęła na Twoją komunikację." },
      { title: "Analiza lidera", desc: "Zanotuj jeden trik Toastmastera Wieczoru, który ułatwił przejście między punktami." },
      { title: "Lustro", desc: "Podczas rozmowy spróbuj subtelnie naśladować mowę ciała rozmówcy przez 1 minutę." },
      { title: "Entuzjasta", desc: "Bądź osobą, która najgłośniej klaszcze po każdym wystąpieniu." },
      { title: "Pozytywna energia", desc: "Skomplementuj dwie osoby za coś, co nie jest związane z ich mową." },
      { title: "Last man standing", desc: "Zostań do samego końca, żeby pomóc posprzątać salę." },
      { title: "Wysoka piątka", desc: "Przybij piątkę osobie, która właśnie zeszła ze sceny." },
      { title: "Strażnik wody", desc: "Upewnij się, że mówca ma dostęp do wody przed swoim wystąpieniem." },
      { title: "Konstruktywny tip", desc: "Po spotkaniu przekaż jednej osobie jedną rzecz, którą może poprawić w swojej mowie." },
      { title: "Pytanie o progres", desc: "Zapytaj kogoś, nad jakim projektem w Pathways teraz pracuje." },
      { title: "Fan humoru", desc: "Jeśli ktoś powie żart, zareaguj na niego entuzjastycznie." },
      { title: "Social Media Ninja", desc: "Zrób zdjęcie (za zgodą) i wspomnij o klubie w swoich relacjach." },
      { title: "Pomocna dłoń", desc: "Pomóż Sierżantowi w przygotowaniu lub sprzątnięciu sali." },
      { title: "Feedback Ewaluatora", desc: "Powiedz osobie oceniającej mowę, co najbardziej podobało Ci się w jej ewaluacji." },
      { title: "Historyk klubu", desc: "Zapytaj jednego z najstarszych stażem członków o historię Waszego klubu." },
      { title: "Inspiracja", desc: "Podziel się z kimś w przerwie jednym cytatem, który Cię ostatnio zainspirował." },
      { title: "Uważny obserwator", desc: "Zauważ jeden ciekawy szczegół w stroju innej osoby i skomplementuj go." },
      { title: "Cichy kibic", desc: "Podczas mowy potakuj głową, dając mówcy sygnał, że go aktywnie słuchasz." },
      { title: "Łowca talentów", desc: "Zapytaj gościa, czym zajmuje się zawodowo i jak to się łączy z komunikacją." },
      { title: "Mistrz logistyki", desc: "Zaproponuj pomoc przy obsłudze stopera lub dzwonka, jeśli zajdzie potrzeba." },
      { title: "Poszukiwacz opinii", desc: "Zapytaj osobę obok, co najbardziej podobało jej się w pierwszej części spotkania." },
      { title: "Ambasador uśmiechu", desc: "Przez całą przerwę staraj się mieć uśmiech na twarzy." },
      { title: "Słuchacz idealny", desc: "Nie przerywaj nikomu wypowiedzi, nawet jeśli bardzo chcesz coś dodać." },
      { title: "Recenzent agendy", desc: "Pochwal Toastmastera Wieczoru za dobór tematu lub prowadzenie." },
      { title: "Kolekcjoner imion", desc: "Zapamiętaj imiona przynajmniej 5 osób, których wcześniej nie znałeś." },
      { title: "Wsparcie techniczne", desc: "Zapytaj osobę odpowiedzialną za nagrania, czy nie potrzebuje pomocy." },
      { title: "Innowator", desc: "Zaproponuj jedną zmianę, która mogłaby uatrakcyjnić spotkania klubu." },
      { title: "Partner do mowy", desc: "Zaproponuj komuś, że przesłuchasz jego mowę przed następnym spotkaniem." },
      { title: "Analiza tezy", desc: "Spróbuj wyłapać główną myśl (tezę) w każdej wygłoszonej dziś mowie." },
      { title: "Dobry sąsiad", desc: "Zapytaj osobę siedzącą obok, jak mija jej tydzień (poza Toastmasters)." },
      { title: "Finałowy uścisk", desc: "Po zakończeniu oficjalnej części, podziękuj organizatorom za energię." }
    ];

    const KEY = 'sqtm_quest';

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data.date === todayStr()) return data.index;
        }
      } catch(e) {}
      return null;
    }

    function save(index) {
      localStorage.setItem(KEY, JSON.stringify({ date: todayStr(), index }));
    }

    function init() {
      let index = load();
      if (index === null) {
        index = Math.floor(Math.random() * QUESTS.length);
        save(index);
      }
      const q = QUESTS[index];
      document.getElementById('questTitle').textContent = q.title;
      document.getElementById('questDesc').textContent  = q.desc;
    }

    init();
  </script>
</body>
</html>
