* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -40%;
  left: -20%;
  width: 80vw;
  height: 80vw;
  background: radial-gradient(circle, rgba(232,255,62,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

header {
  text-align: center;
}

.badge {
  display: inline-block;
  background: var(--accent);
  color: #0d0d0d;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 2px;
  margin-bottom: 16px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 6vw, 3rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
}

h1 span {
  color: var(--accent);
}

.subtitle {
  margin-top: 10px;
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
}

/* CARD */
.card {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px;
  height: 100%;
  background: var(--accent);
}

.quest-number {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 80px;
  line-height: 1;
  color: var(--border);
  position: absolute;
  top: 16px;
  right: 20px;
  letter-spacing: -0.04em;
  user-select: none;
  transition: color 0.5s ease;
}

.quest-label {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  margin-bottom: 16px;
}

.quest-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: clamp(1.3rem, 4vw, 1.7rem);
  line-height: 1.2;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}

.quest-desc {
  font-size: 15px;
  line-height: 1.7;
  color: #bbb;
  font-weight: 300;
  position: relative;
  z-index: 1;
}

.card.animating {
  animation: cardFlip 0.4s ease;
}

@keyframes cardFlip {
  0% { opacity: 1; transform: translateY(0); }
  40% { opacity: 0; transform: translateY(-12px); }
  60% { opacity: 0; transform: translateY(12px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* BUTTON */
.btn {
  width: 100%;
  background: var(--accent);
  color: #0d0d0d;
  border: none;
  border-radius: 10px;
  padding: 16px 24px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(232,255,62,0.25);
}

.btn:active {
  transform: translateY(0);
}

.btn svg {
  flex-shrink: 0;
}

/* progress */
.progress {
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.progress strong {
  color: var(--text);
}

/* reset info */
.reset-info {
  font-size: 11px;
  color: #333;
  text-align: center;
}

.reset-info span {
  color: var(--muted);
}

    const STORAGE_KEY = 'sq_quest';

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function loadQuest() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data.date === todayStr()) return data.index;
        }
      } catch(e) {}
      return null;
    }

    function saveQuest(index) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayStr(), index }));
    }

    function pickRandom(exclude) {
      let idx;
      do { idx = Math.floor(Math.random() * QUESTS.length); }
      while (idx === exclude && QUESTS.length > 1);
      return idx;
    }

    function render(index, animate) {
      const card = document.getElementById('card');
      const q = QUESTS[index];

      if (animate) {
        card.classList.add('animating');
        card.addEventListener('animationend', () => card.classList.remove('animating'), { once: true });
      }

      document.getElementById('questNum').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('questTitle').textContent = q.title;
      document.getElementById('questDesc').textContent = q.desc;
      document.getElementById('progress').innerHTML =
        `Quest <strong>${index + 1}</strong> z <strong>${QUESTS.length}</strong>`;

      // Reset info
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tStr = tomorrow.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('resetInfo').innerHTML =
        `<span>Nowe losowanie dostępne od: ${tStr}</span>`;
    }

    let currentIndex = null;

    function init() {
      const saved = loadQuest();
      if (saved !== null) {
        currentIndex = saved;
        render(currentIndex, false);
      } else {
        currentIndex = pickRandom(-1);
        saveQuest(currentIndex);
        render(currentIndex, false);
      }
    }

    function reroll() {
      currentIndex = pickRandom(currentIndex);
      saveQuest(currentIndex);
      render(currentIndex, true);
    }

    init();
  </script>
